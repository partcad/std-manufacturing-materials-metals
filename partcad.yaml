    desc: |
      304 with molybdenum, which is what it takes to hold up against chlorides:
      salt water, de-icing salt, chemical plant and the inside of a body. The
      L is the low-carbon variant that can be welded without sensitising the
      heat affected zone, and it is the most common stainless powder for
      printed metal parts.
