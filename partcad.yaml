  # What a bolt, screw or stud of an ISO 898-1 property class is made of when
  # it is made of 4140, by its class. ISO 898-1 asks of every class from 8.8 up
  # a steel quenched and tempered at 425 C or more (Table 2), and of each a
  # minimum 0.2 % proof strength and tensile strength (Table 3); its tempering
  # temperature here is the highest at which 4140 - Lucefin's 42CrMo4 table,
  # as in steel-4140 - still meets both: 700, 690, 623 and 550 C for 8.8,
  # 9.8, 10.9 and 12.9. Its yield is the class's minimum Rp0.2, which is what a
  # bolted joint is designed to.
  steel-4140-iso898:
    type: enrich
    source: ":steel-4140"
    parameters:
      propertyClass:
        type: float
        default: 10.9
        min: 8.8
        max: 12.9
        desc: "ISO 898-1 property class: 8.8, 9.8, 10.9 or 12.9 (8.8 as for diameters up to 16 mm)"
    # The class's minima, ISO 898-1:2013 Table 3, as Wurth Industrie reproduces
    # its Tables 2 and 3 (https://prueflabor.wuerth-industrie.com/web/media/en/pictures/wuerthindustrie/technikportal/dinokapitel/Kapitel_01_DINO_techn_Teil.pdf):
    # Rp0.2 640 (d <= 16 mm), 720, 940 and 1100 MPa; Rm 800, 900, 1040 and 1220
    # MPa. Each is looked up in Lucefin's 42CrMo4 table backwards (the strengths
    # in increasing order against the tempering temperatures that give them,
    # from 700 down to 200 C, interpolated), the lower temperature of the two
    # kept, and never below ISO 898-1's 425 C.
    with:
      condition: quenched-and-tempered
      tempering: "%round(max(425, min(interpolate(pick(propertyClass, [8.8, 9.8, 10.9, 12.9], [6.4e+8, 7.2e+8, 9.4e+8, 1.1e+9]), [7.1e+8, 8.7e+8, 1.0e+9, 1.11e+9, 1.23e+9, 1.34e+9, 1.44e+9, 1.51e+9, 1.56e+9, 1.59e+9, 1.62e+9], [700, 650, 600, 550, 500, 450, 400, 350, 300, 250, 200]), interpolate(pick(propertyClass, [8.8, 9.8, 10.9, 12.9], [8.0e+8, 9.0e+8, 1.04e+9, 1.22e+9]), [8.8e+8, 9.8e+8, 1.1e+9, 1.22e+9, 1.35e+9, 1.48e+9, 1.59e+9, 1.7e+9, 1.8e+9, 1.91e+9, 2.03e+9], [700, 650, 600, 550, 500, 450, 400, 350, 300, 250, 200]))))%"
    formal: "AISI 4140, ISO 898-1 class %propertyClass%"
    full: "Chromium-molybdenum steel AISI 4140, quenched and tempered to ISO 898-1 property class %propertyClass%"
    desc: |
      One of the steels a high-strength bolt, screw or stud is made of: 4140
      quenched and tempered to an ISO 898-1 property class - 10.9 by default,
      or 8.8, 9.8 or 12.9. Its yield strength is the class's minimum, which is
      what a bolted joint is designed to.
    url: https://en.wikipedia.org/wiki/ISO_898
    yieldStrength: "%pick(propertyClass, [8.8, 9.8, 10.9, 12.9], [6.4e+8, 7.2e+8, 9.4e+8, 1.1e+9])%" # Pa; SPECIFICATION MINIMUM Rp0.2 of the property class, ISO 898-1:2013 Table 3, as Wurth Industrie reproduces it (above).
    tags:
      - metal
      - steel
      - fastener
      - heat-treatable
      - high-strength
