    desc: |
      Stainless with the strength of an alloy steel, reached by a single low
      temperature ageing treatment that distorts almost nothing - so a part can
      be machined to size soft and hardened afterwards. Aerospace fittings,
      valve and pump shafts, injection mould inserts, and a common printed
      metal alloy.
