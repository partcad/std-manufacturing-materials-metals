    formal: Ti Grade 2
    full: Commercially pure titanium, Grade 2
    desc: |
      Unalloyed titanium: much weaker than Grade 5 and much easier to form and
      weld, with the same corrosion immunity. Sheet, tube, heat exchangers,
      chemical and marine hardware, and surgical instruments.
    url: https://en.wikipedia.org/wiki/Titanium
    density: 4510
    youngsModulus: 1.02e+11 # Pa, CP titanium Grade 2; annealed 2 h at 700 C. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=mtu021
