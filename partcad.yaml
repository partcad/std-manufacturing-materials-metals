      - nickel
      - aviation
      - high-temperature
      - high-strength
  inconel-625:
    formal: Inconel 625
    full: Nickel-chromium superalloy Inconel 625
    desc: |
      Solid-solution strengthened rather than aged, so it is formed and welded
      more easily than 718 and gives up some strength for it. Exhaust systems,
      bellows, expansion joints, seawater and chemical hardware, and weld
      overlay on things made of something cheaper.
    url: https://en.wikipedia.org/wiki/Inconel
    density: 8440
    youngsModulus: 2.075e+11 # Pa, Inconel 625; annealed, 21 C. https://www.specialmetals.com/documents/technical-bulletins/inconel/inconel-alloy-625.pdf
    poissonsRatio: 0.278 # Inconel 625; annealed, 21 C. https://www.specialmetals.com/documents/technical-bulletins/inconel/inconel-alloy-625.pdf
