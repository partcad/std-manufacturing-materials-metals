  inconel-718:
    formal: Inconel 718
    full: Nickel-chromium superalloy Inconel 718
    desc: |
      The workhorse superalloy of a gas turbine: discs, casings, shafts,
      fasteners and rocket-engine parts that have to keep their strength to
      about 700 C. It is age hardened, weldable by superalloy standards, and
      notoriously hard on cutting tools, which is one reason so much of it is
      now printed.
    url: https://en.wikipedia.org/wiki/Inconel
    density: 8190
    youngsModulus: 1.999e+11 # Pa, Inconel 718; solution annealed + aged, 70 F. https://www.specialmetals.com/documents/technical-bulletins/inconel/inconel-alloy-718.pdf
