    # Normalized: 435 MPa, AISI 4130 normalized at 870 C (1600 F), 25 mm round, typical, https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=m4130r .
    # Quenched and tempered: Rp0.2 of 25CrMo4 (1.7218, which Lucefin gives as AISI 4130's equivalent) after quenching at 840 C in water and tempering at 500, 550, 600 and 650 C - 770, 680, 600 and 540 N/mm^2 - from Lucefin's tempering table, https://www.lucefin.com/wp-content/files_mf/152336974825CrMo4.pdf ; interpolated between them.
    yieldStrength: "%pick(condition, ['normalized', 'quenched-and-tempered'], [4.35e+8, interpolate(tempering, [500, 550, 600, 650], [7.7e+8, 6.8e+8, 6.0e+8, 5.4e+8])])%" # Pa, typical; the two sources above.
    thermalConductivity: 42.7 # W/(m*K), AISI 4130; at 100 C; taken for every condition. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=m4130r
    mu: 0.6
