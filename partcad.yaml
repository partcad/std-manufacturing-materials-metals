# The package path this catalogue is published at inside partcad-index, so
# that standalone development uses the very same addresses its consumers will.
# It is 'metal' rather than 'metals' because the sibling catalogue is
# 'plastic': the segment names the family a material belongs to, one material
# at a time, and 'material/metals:al-5052-h32' would read as neither.
name: //pub/std/manufacturing/material/metal

# Every density below is in kg/m^3, which is the unit PartCAD reads a density in
# from the release that resolves a part's mass from its material (0.8.174,
# partcad/partcad#755). Before it, a density was read in g/mm^3, in which the
# same substance is a number a million times smaller.
#
# 0.10.21 is the first release with partcad/partcad's parametric-materials
# change, which this file is written against: the bounds on a parameter
# ('min:'/'max:'), the table functions the computed values are written with
# ('pick', 'interpolate', 'interpolate_color'), a number computed from a
# parameter in a material's fields, and 'type: enrich'. An older PartCAD has
# none of the functions, so every computed value here would fail to evaluate,
# and it does not know an enrich, so names such as 'al-6061-t6' would not
# resolve to what they name. It is refused here rather than left to load a
# catalogue it cannot read.
partcad: ">=0.10.21"

desc: Standard metals and alloys, as PartCAD materials.

# The conventions this file keeps, so that a reader does not have to work them
# out from the entries:
#
# * The name is '<metal>-<designation>[-<temper>]' and never the bare
#   designation. '5052:' is not a name in YAML at all - it is the integer 5052,
#   which is not what a part's 'material' parameter says and not what the
#   material name pattern accepts. A name without a temper is the alloy, with
#   its temper or condition as a parameter (below); a name with one - the
#   'al-6061-t6' consumers reference - is that alloy in that temper, because
#   6061-T6 and 6061-O are the same alloy and not the same material to build
#   out of.
#
# * Parameters. Where the standard really has a dimension - a temper, a
#   tempering temperature, a grade, a zinc or tin content - the material takes
#   it as a parameter, and a reference names the value: 'al-6061;temper=O',
#   'steel-4140;condition=quenched-and-tempered,tempering=540',
#   'brass;zinc=0.35'. A temper or condition the standard names is a string
#   from the list it may be; anything numbered is a number, with 'min:' and
#   'max:' where the data behind it ends, and a value outside them is refused.
#   Named without values a material is its defaults, which state what it
#   stated before it had parameters, to the digit. Where it stated nothing for
#   want of a condition - a 4340 with no temper, a copper with no temper, a
#   gray iron with no grade - its default condition now states its value.
#
# * Computed values. A number that depends on a parameter is written as a
#   PartCAD expression ('%...%'): 'pick' from a table where the standard names
#   the condition, 'interpolate' - piecewise linear - through the published
#   grades where it numbers it. The comment beside each says which points are
#   sourced and where from; every value between two points is interpolated, and
#   none is extrapolated ('interpolate' holds the end value past the last point,
#   and the bounds keep a reference inside the points anyway). A material that
#   is not parametric has plain numbers, as it always had.
#
# * Enrich. 'type: enrich' is a material of its own made from another one with
#   parameter values for it, under its own name: 'al-6061-t6' is 'al-6061' with
#   'temper: T6'. It takes every field of what it is made from and may state
#   its own. A stacked one has parameters of its own, mapped onto the source's:
#   'steel-4140-iso898' takes an ISO 898-1 property class and works out the
#   tempering temperature of 4140 that meets it.
#
# * 'density' is kg/m^3, the one unit PartCAD has for a density. A datasheet
#   often quotes g/cm^3, 1000x smaller: 5052 at 2.68 g/cm^3 is 2680 here.
#   Density is a property of the alloy rather than of the temper, so it is the
#   one fact below that does not move when the temper does.
#
# * 'mu' is a typical *dry, unlubricated, self-mated* sliding coefficient - the
#   pair the friction tables tabulate for a metal, and the single number every
#   simulator takes for a surface. It is stated only for aluminium and for the
#   steels, where those tables agree with each other; where they do not, it is
#   left out rather than invented, and a part made of such a material gets the
#   simulator's default exactly as it did before anybody catalogued it.
#
# * 'color' is claimed only by a bare metal whose surface as machined is what
#   any part made of it looks like: aluminium, the stainless and machinable
#   steels, bearing steel, titanium, copper, brass and bronze. A part made of one
#   that states no colour is that colour (see 'colors' below). The rest claim
#   none: hot-rolled and car-body steel comes scaled or coated and is painted,
#   magnesium and zinc castings are coated or plated, cast iron is a casting
#   skin until it is machined, and the nickel alloys have no colour here yet.
#
# What an analysis of a part made of one of these is solved with -- the
# 'youngsModulus' (Pa), 'poissonsRatio', 'yieldStrength' (Pa) and
# 'thermalConductivity' (W/(m*K)) beside each density -- is stated only where it
# is known for the material named, and the comment beside each value says which
# grade, in which condition, and where the number comes from. A property that is
# absent was not known well enough to state: a part made of the material is then
# analysed at the implementation's own default for it, which is visibly a
# default, rather than at a guess that looks like a fact. PartCAD 0.10.17 and
# later read these keys and hand them to a part's analyses.

# The natural colours of the bare metals the materials below claim. Each is a
# display: how a part made of the metal is drawn, approximated from how the
# metal looks as machined, and not a measurement of it. The copper alloys'
# colours follow the names the Copper Development Association gives each
# alloy's natural colour ('Copper in Architecture', A4039, pages 11, 27 and 28,
# https://copper.org/publications/pub_list/pdf/A4039-ArchitecturalApplications.pdf),
# which prints swatches of them as well and says itself that print can only
# represent them. The greys are chosen to sit in the order the metals do -
# aluminium lightest, then stainless, bearing steel, carbon steel and titanium,
# which is the warm one - and aluminium, stainless and bearing steel are the
# greys //pub/robotics/parts/gobilda already draws them in.
colors:
  aluminium:
    desc: Bare aluminium as machined, which is also how it looks under a clear anodised coat. A display colour, approximated
    display: "#C4C6C8"
  stainless-steel:
    desc: Stainless steel as machined. A display colour, approximated
    display: "#A8ABAF"
  bearing-steel:
    desc: Through-hardened bearing steel as ground. A display colour, approximated
    display: "#9A9DA1"
  steel:
    desc: Carbon and low-alloy steel as machined, before it is oiled, plated or painted. A display colour, approximated
    display: "#8E9194"
  titanium:
    desc: Titanium as machined, a warmer and darker grey than steel. A display colour, approximated
    display: "#8F8B86"
  copper:
    desc: >-
      Copper as machined: the 'salmon red' CDA names as the natural colour of
      C11000. A display colour, approximated
    display: "#C27B5F"
  brass:
    desc: >-
      Brass as machined, by its zinc content: from the red of copper through
      the 'red gold' of commercial bronze (10 per cent zinc), the 'reddish
      yellow' of red brass (15) and the 'yellow' of cartridge brass (30) to the
      'reddish yellow' of Muntz metal (40), as CDA names them. A display
      colour, approximated at each of those alloys and mixed in Oklab between
      them
    parameters:
      zinc:
        type: float
        default: 0.3
        min: 0
        max: 0.4
        desc: Zinc, mass fraction (0.3 is cartridge brass, C26000); the rest copper
    # The stops: 0 copper (C11000, 'salmon red'), 0.10 C22000 ('red gold'), 0.15
    # C23000 ('reddish yellow'), 0.30 C26000 ('yellow'), 0.40 C28000 ('reddish
    # yellow'), each the CDA's name for the alloy's natural colour (A4039, above),
    # each colour an approximation of that name; between two stops the colour is
    # interpolated in Oklab.
    display: "%interpolate_color(zinc, [0, 0.1, 0.15, 0.3, 0.4], ['#C27B5F', '#C68F62', '#C99A63', '#CDAE66', '#C7A25B'])%"
  bronze:
    desc: >-
      Tin bronze as machined, the darker, browner gold of the bearing and
      phosphor bronzes. A display colour, approximated
    display: "#B08A5B"

materials:
  #
  # Aluminium
  #
  # The wrought alloys take their temper as a parameter. Every value of every
  # temper is the Aluminum Association's typical figure ("AA; Typical", not a
  # specification minimum) unless its comment says otherwise, from the data
  # sheet Aerospace Specification Metals publishes for that temper, under
  # https://www.aerospacemetals.com/wp-content/uploads/2023/06/ - the same data
  # its pages on asm.matweb.com show, which this catalogue cited before it had
  # tempers. A temper one sheet gives together with its stress-relieved twin
  # ('T6, T651') is the same values under both names.
  al-5052:
    parameters:
      temper:
        type: string
        enum: [O, H32, H34, H36, H38]
        default: H32
        desc: "The temper (ANSI H35.1): O annealed; H32, H34, H36, H38 strain hardened and stabilised, quarter, half, three-quarter and full hard"
    formal: "5052-%temper%"
    full: "Aluminium alloy 5052-%temper%"
    desc: |
      The sheet-metal aluminium. An Al-Mg alloy that is not heat treatable and
      gets its strength from work hardening, which is what makes it bend
      without cracking on a press brake and hold the bend afterwards: folded
      chassis, brackets, enclosures and battery trays are 5052 far more often
      than anything else. It welds, it resists salt water better than the
      heat-treatable alloys, and it has the best fatigue life of the common
      sheet grades - but it does not machine cleanly and cannot be strengthened
      by heat treatment afterwards.
    url: https://en.wikipedia.org/wiki/5052_aluminium_alloy
    # The temper's sheets:
    #   O    https://www.aerospacemetals.com/wp-content/uploads/2023/06/Aluminum-5052-O.pdf
    #   H32  https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA5052H32 , as https://www.aerospacemetals.com/wp-content/uploads/2023/06/Aluminum-5052-H32.pdf
    #   H34  https://www.aerospacemetals.com/wp-content/uploads/2023/06/Aluminum-5052-H34.pdf
    #   H36  https://www.aerospacemetals.com/wp-content/uploads/2023/06/Aluminum-5052-H36.pdf
    #   H38  https://www.aerospacemetals.com/wp-content/uploads/2023/06/Aluminum-5052-H38.pdf
    density: 2680 # kg/m^3
    youngsModulus: 7.03e+10 # Pa, 5052, every temper (70.3 GPa on every sheet above); average of tension and compression.
    poissonsRatio: 0.33 # 5052, every temper; every sheet above.
    yieldStrength: "%pick(temper, ['O', 'H32', 'H34', 'H36', 'H38'], [8.96e+7, 1.93e+8, 2.14e+8, 2.41e+8, 2.55e+8])%" # Pa, 5052; typical (AA), not a specification minimum; each temper's sheet above.
    thermalConductivity: 138 # W/(m*K), 5052, every temper; at 77 F (25 C); every sheet above.
    mu: 1.05
    color: ":aluminium"
    tags:
      - metal
      - aluminium
      - sheet-metal
      - formable
      - weldable
      - corrosion-resistant
      - fatigue-resistant
  al-5052-h32:
    type: enrich
    source: ":al-5052"
    with: {temper: H32}
  al-6061:
    parameters:
      temper:
        type: string
        enum: [O, T4, T451, T6, T651]
        default: T6
        desc: "The temper (ANSI H35.1): O annealed; T4 solution heat treated and naturally aged; T6 solution heat treated and artificially aged; T451 and T651 the same, stress relieved by stretching (plate and bar)"
    formal: "6061-%temper%"
    full: "Aluminium alloy 6061-%temper%"
    desc: |
      The general-purpose structural aluminium: plate, bar and extrusion for
      machined robot links, mounting plates, heat sinks and airframe fittings.
      Heat treatable, weldable, and it machines and anodises well, which is why
      it is the default for anything cut from solid - in T6, its usual temper.
      Welding anneals the heat affected zone back towards the annealed
      strength, so a welded frame is not a T6 frame unless it is re-treated.
    url: https://en.wikipedia.org/wiki/6061_aluminium_alloy
    # The temper's sheets:
    #   O          https://www.aerospacemetals.com/wp-content/uploads/2023/06/Aluminum-6061-O.pdf
    #   T4, T451   https://www.aerospacemetals.com/wp-content/uploads/2023/06/Aluminum-6061-T4-6061-T451.pdf
    #   T6, T651   https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA6061T6 , as https://www.aerospacemetals.com/wp-content/uploads/2023/06/Aluminum-6061-T6-6061-T651.pdf
    density: 2700
    youngsModulus: 6.89e+10 # Pa, 6061, every temper (68.9 GPa on every sheet above); average of tension and compression.
    poissonsRatio: 0.33 # 6061, every temper; every sheet above, which gives it as estimated from similar alloys.
    yieldStrength: "%pick(temper, ['O', 'T4', 'T451', 'T6', 'T651'], [5.52e+7, 1.45e+8, 1.45e+8, 2.76e+8, 2.76e+8])%" # Pa, 6061; typical (AA), not a specification minimum; each temper's sheet above.
    thermalConductivity: "%pick(temper, ['O', 'T4', 'T451', 'T6', 'T651'], [180, 154, 154, 167, 167])%" # W/(m*K), 6061; at 77 F (25 C); each temper's sheet above.
    mu: 1.05
    color: ":aluminium"
    tags:
      - metal
      - aluminium
      - machinable
      - weldable
      - heat-treatable
      - structural
  al-6061-t6:
    type: enrich
    source: ":al-6061"
    with: {temper: T6}
  al-6063:
    parameters:
      temper:
        type: string
        enum: [O, T1, T4, T5, T6]
        default: T5
        desc: "The temper (ANSI H35.1): O annealed; T1 cooled from extrusion and naturally aged; T4 solution heat treated and naturally aged; T5 cooled from extrusion and artificially aged, the usual one; T6 solution heat treated and artificially aged"
    formal: "6063-%temper%"
    full: "Aluminium alloy 6063-%temper%"
    desc: |
      The extrusion alloy. It flows through a die into thin, complex and
      accurate sections and takes a clean anodised finish, at some cost in
      strength against 6061 - so it is what T-slot framing, enclosure profiles,
      rails and heat-sink fins are made of. Robot cells and test rigs are
      largely built out of it without anybody machining anything.
    url: https://en.wikipedia.org/wiki/6063_aluminium_alloy
    # The temper's sheets:
    #   O    https://www.aerospacemetals.com/wp-content/uploads/2023/06/Aluminum-6063-O.pdf
    #   T1   https://www.aerospacemetals.com/wp-content/uploads/2023/06/Aluminum-6063-T1.pdf
    #   T4   https://www.aerospacemetals.com/wp-content/uploads/2023/06/Aluminum-6063-T4.pdf
    #   T5   https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA6063T5 (typical, 1.6 mm), as https://www.aerospacemetals.com/wp-content/uploads/2023/06/Aluminum-6063-T5.pdf
    #   T6   https://www.aerospacemetals.com/wp-content/uploads/2023/06/Aluminum-6063-T6.pdf
    density: 2700
    youngsModulus: 6.89e+10 # Pa, 6063, every temper (68.9 GPa on every sheet above); average of tension and compression.
    poissonsRatio: 0.33 # 6063, every temper; the O, T1, T4 and T6 sheets above, and asm.matweb.com's T5 page.
    yieldStrength: "%pick(temper, ['O', 'T1', 'T4', 'T5', 'T6'], [4.83e+7, 8.96e+7, 8.96e+7, 1.45e+8, 2.14e+8])%" # Pa, 6063; typical (AA), not a specification minimum; each temper's sheet above.
    thermalConductivity: "%pick(temper, ['O', 'T1', 'T4', 'T5', 'T6'], [218, 193, 200, 209, 200])%" # W/(m*K), 6063; at 77 F (25 C); each temper's sheet above, whose T4 figure is estimated from the other tempers rather than AA's.
    mu: 1.05
    color: ":aluminium"
    tags:
      - metal
      - aluminium
      - extrusion
      - framing
      - anodising
  al-6063-t5:
    type: enrich
    source: ":al-6063"
    with: {temper: T5}
  al-6082-t6:
    formal: 6082-T6
    full: Aluminium alloy 6082-T6
    desc: |
      The European structural alloy, and what a supplier there offers where a
      US drawing asks for 6061: the same Al-Mg-Si family, a little stronger,
      slightly less obliging to machine and anodise. Plate and extrusion for
      frames, brackets and transport structures.
    url: https://en.wikipedia.org/wiki/6082_aluminium_alloy
    density: 2700
    youngsModulus: 7.0e+10 # Pa, 6082-T6; T6/T651. https://www.aalco.co.uk/datasheets/Aluminium-Alloy-6082-T6T651-Plate_148.ashx
    poissonsRatio: 0.33 # 6082-T6; T6. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA6061T6
    yieldStrength: 2.55e+8 # Pa, 6082-T6; T6/T651 plate 6-12.5 mm; SPECIFICATION MINIMUM per BS EN 485-2:2008 (240 MPa min for 12.5-150 mm). https://www.aalco.co.uk/datasheets/Aluminium-Alloy-6082-T6T651-Plate_148.ashx
    thermalConductivity: 180 # W/(m*K), 6082-T6; T6/T651, room temperature. https://www.aalco.co.uk/datasheets/Aluminium-Alloy-6082-T6T651-Plate_148.ashx
    mu: 1.05
    color: ":aluminium"
    tags:
      - metal
      - aluminium
      - structural
      - weldable
      - heat-treatable
  al-7075:
    parameters:
      temper:
        type: string
        enum: [O, T6, T651, T73, T7351]
        default: T6
        desc: "The temper (ANSI H35.1): O annealed; T6 solution heat treated and artificially aged, T651 the same stress relieved; T73 and T7351 overaged, for resistance to stress-corrosion cracking at some cost in strength"
    formal: "7075-%temper%"
    full: "Aluminium alloy 7075-%temper%"
    desc: |
      The strong one: an Al-Zn alloy that reaches the strength of a mild steel
      at a third of the density, and the reason aircraft fittings, wing spars,
      landing-gear components, competition suspension uprights and highly
      loaded robot arms are cut from it. The price is that it is effectively
      not weldable, is more prone to stress-corrosion cracking than the 5000
      and 6000 series - which is what the overaged T73 tempers trade strength
      against - and costs several times as much.
    url: https://en.wikipedia.org/wiki/7075_aluminium_alloy
    # The temper's sheets:
    #   O           https://www.aerospacemetals.com/wp-content/uploads/2023/06/Aluminum-7075-O.pdf
    #   T6, T651    https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA7075T6 , as https://www.aerospacemetals.com/wp-content/uploads/2023/06/Aluminum-7075-T6-7075-T651.pdf
    #   T73, T7351  https://www.aerospacemetals.com/wp-content/uploads/2023/06/Aluminum-7075-T73-7075-T735x.pdf , whose figures are not marked AA
    density: 2810
    youngsModulus: "%pick(temper, ['O', 'T6', 'T651', 'T73', 'T7351'], [7.17e+10, 7.17e+10, 7.17e+10, 7.2e+10, 7.2e+10])%" # Pa, 7075; average of tension and compression; each temper's sheet above.
    poissonsRatio: 0.33 # 7075, every temper; every sheet above.
    yieldStrength: "%pick(temper, ['O', 'T6', 'T651', 'T73', 'T7351'], [1.03e+8, 5.03e+8, 5.03e+8, 4.35e+8, 4.35e+8])%" # Pa, 7075; typical, not a specification minimum (AA's for O and T6); each temper's sheet above.
    thermalConductivity: "%pick(temper, ['O', 'T6', 'T651', 'T73', 'T7351'], [173, 130, 130, 155, 155])%" # W/(m*K), 7075; at 77 F (25 C) where the sheet says; each temper's sheet above.
    mu: 1.05
    color: ":aluminium"
    tags:
      - metal
      - aluminium
      - aviation
      - high-strength
      - machinable
  al-7075-t6:
    type: enrich
    source: ":al-7075"
    with: {temper: T6}
  al-2024:
    parameters:
      temper:
        type: string
        enum: [O, T3, T351, T361, T4, T81, T86]
        default: T3
        desc: "The temper (ANSI H35.1): O annealed; T3 solution heat treated, cold worked and naturally aged, the sheet temper; T351 the same stress relieved (plate); T361 cold worked more; T4 solution heat treated and naturally aged; T81 and T86 cold worked and artificially aged"
    formal: "2024-%temper%"
    full: "Aluminium alloy 2024-%temper%"
    desc: |
      The riveted-airframe alloy. An Al-Cu alloy with the fatigue and
      damage-tolerance behaviour a pressurised fuselage skin needs, which is
      what has kept it in aircraft structure for eighty years. Its corrosion
      resistance is poor, so sheet is normally bought Alclad - rolled with a
      thin layer of pure aluminium on each face - and it is riveted rather than
      welded.
    url: https://en.wikipedia.org/wiki/2024_aluminium_alloy
    # The temper's sheets:
    #   O          https://www.aerospacemetals.com/wp-content/uploads/2023/06/Aluminum-2024-O.pdf
    #   T3         https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA2024T3 (typical, 1.6 mm sheet), as https://www.aerospacemetals.com/wp-content/uploads/2023/06/Aluminum-2024-T3.pdf
    #   T351, T4   https://www.aerospacemetals.com/wp-content/uploads/2023/06/Aluminum-2024-T4-2024-T351.pdf
    #   T361       https://www.aerospacemetals.com/wp-content/uploads/2023/06/Aluminum-2024-T361.pdf
    #   T81        https://www.aerospacemetals.com/wp-content/uploads/2023/06/Aluminum-2024-T81.pdf , whose strength is not marked AA
    #   T86        https://www.aerospacemetals.com/wp-content/uploads/2023/06/Aluminum-2024-T86.pdf , whose strength is not marked AA
    density: 2780
    youngsModulus: "%pick(temper, ['O', 'T3', 'T351', 'T361', 'T4', 'T81', 'T86'], [7.31e+10, 7.31e+10, 7.31e+10, 7.31e+10, 7.31e+10, 7.24e+10, 7.24e+10])%" # Pa, 2024; average of tension and compression; each temper's sheet above.
    poissonsRatio: 0.33 # 2024, every temper; every sheet above.
    yieldStrength: "%pick(temper, ['O', 'T3', 'T351', 'T361', 'T4', 'T81', 'T86'], [7.58e+7, 3.45e+8, 3.24e+8, 3.93e+8, 3.24e+8, 4.5e+8, 4.4e+8])%" # Pa, 2024; typical, not a specification minimum (AA's but for T81 and T86); each temper's sheet above.
    thermalConductivity: "%pick(temper, ['O', 'T3', 'T351', 'T361', 'T4', 'T81', 'T86'], [193, 121, 121, 121, 121, 151, 151])%" # W/(m*K), 2024; at 77 F (25 C); each temper's sheet above.
    mu: 1.05
    color: ":aluminium"
    tags:
      - metal
      - aluminium
      - aviation
      - fatigue-resistant
      - high-strength
  al-2024-t3:
    type: enrich
    source: ":al-2024"
    with: {temper: T3}
  al-5083:
    parameters:
      temper:
        type: string
        enum: [H112, H116, H321]
        default: H116
        desc: "The temper (ANSI H35.1): H112 as fabricated, with some strain hardening; H116 and H321 strain hardened and stabilised for marine service"
    formal: "5083-%temper%"
    full: "Aluminium alloy 5083-%temper%"
    desc: |
      The strongest of the non-heat-treatable alloys, and the one that keeps
      its strength where it is welded. Marine hulls, pressure vessels,
      cryogenic tanks and armour plate; in vehicles and robots it turns up
      wherever a welded aluminium structure has to be as strong as the sheet it
      was made from.
    url: https://en.wikipedia.org/wiki/5083_aluminium_alloy
    # The temper's sheets:
    #   H112        https://www.aerospacemetals.com/wp-content/uploads/2023/06/Aluminum-5083-H112.pdf , whose strength is not marked AA
    #   H116, H321  https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA5083H116 , as https://www.aerospacemetals.com/wp-content/uploads/2023/06/Aluminum-5083-H116-5083-H321.pdf
    density: 2660
    youngsModulus: 7.03e+10 # Pa, 5083, every temper; in tension (70.3 GPa on both sheets above).
