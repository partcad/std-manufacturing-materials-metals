    density: 7850
    youngsModulus: 2.05e+11 # Pa, AISI 4340; normalized / Q&T (insensitive). https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=M434AE
    poissonsRatio: 0.29 # AISI 4340; oil quenched and tempered. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=m434ap
    # Rp0.2 of 34CrNiMo6 (1.6582, which Lucefin gives as AISI 4340's equivalent) on 60 mm rounds quenched at 850 C in oil and tempered at 100, 200, 300, 400, 500, 550, 600, 650 and 700 C - 1450, 1480, 1450, 1350, 1180, 980, 950, 700 and 680 N/mm^2 - from Lucefin's tempering table, https://www.lucefin.com/wp-content/files_mf/152353526334CrNiMo6.pdf ; interpolated between them.
    yieldStrength: "%pick(condition, ['quenched-and-tempered'], [interpolate(tempering, [100, 200, 300, 400, 500, 550, 600, 650, 700], [1.45e+9, 1.48e+9, 1.45e+9, 1.35e+9, 1.18e+9, 9.8e+8, 9.5e+8, 7.0e+8, 6.8e+8])])%" # Pa, typical; the table above.
