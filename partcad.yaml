      condition:
        type: string
        enum: [normalized, quenched-and-tempered]
        default: normalized
        desc: "The heat treatment: normalized - air cooled from 870 C, the condition 4130 tube is sold and welded in - or quenched and tempered at 'tempering'"
      tempering:
        type: float
        default: 600
        min: 500
        max: 650
        desc: "Tempering temperature in C, after water quenching from 840 C: read when 'condition' is quenched-and-tempered, and the range Lucefin's 25CrMo4 table covers"
