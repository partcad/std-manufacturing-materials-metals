# The package path this catalogue is published at inside partcad-index, so
# that standalone development uses the very same addresses its consumers will.
# It is 'metal' rather than 'metals' because the sibling catalogue is
# 'plastic': the segment names the family a material belongs to, one material
# at a time, and 'material/metals:al-5052-h32' would read as neither.
name: //pub/std/manufacturing/material/metal

# Every density below is in kg/m^3, which is the unit PartCAD reads a density in
# from the release that resolves a part's mass from its material. Before it, a
# density was read in g/mm^3, in which the same substance is a number a million
# times smaller - so an older PartCAD would make every part made of these
# materials weigh a million times what it does. It is refused here rather than
# left to weigh anything.
# 0.8.174 is the release partcad/partcad#755 landed in.
partcad: ">=0.8.174"

desc: Standard metals and alloys, as PartCAD materials.

# Three conventions this file keeps, so that a reader does not have to work them
# out from the entries:
#
# * The name is '<metal>-<designation>[-<temper>]' and never the bare
#   designation. '5052:' is not a name in YAML at all - it is the integer 5052,
#   which is not what a part's 'material' parameter says and not what the
#   material name pattern accepts. The temper is part of the name because it is
#   part of what was ordered: 6061-T6 and 6061-O are the same alloy and not the
#   same material to build out of.
#
# * 'density' is kg/m^3, the one unit PartCAD has for a density. A datasheet
#   often quotes g/cm^3, 1000x smaller: 5052 at 2.68 g/cm^3 is 2680 here.
#   Density is a property of the alloy rather than of the temper, so it is the
#   one fact below that does not move when the temper does.
#
# * 'mu' is a typical *dry, unlubricated, self-mated* sliding coefficient - the
#   pair the friction tables tabulate for a metal, and the single number every
#   simulator takes for a surface. It is stated only for aluminium and for the
#   steels, where those tables agree with each other; where they do not, it is
#   left out rather than invented, and a part made of such a material gets the
#   simulator's default exactly as it did before anybody catalogued it.
# What an analysis of a part made of one of these is solved with -- the
# 'youngsModulus' (Pa), 'poissonsRatio', 'yieldStrength' (Pa) and
# 'thermalConductivity' (W/(m*K)) beside each density -- is stated only where it
# is known for the material named, and the comment beside each value says which
# grade, in which condition, and where the number comes from. A property that is
# absent was not known well enough to state: a part made of the material is then
# analysed at the implementation's own default for it, which is visibly a
# default, rather than at a guess that looks like a fact. PartCAD 0.10.17 and
# later read these keys and hand them to a part's analyses. An older one ignores
# them, and only its 'pc lint' reports them as unknown, so the 'partcad:' floor
# above stays where it is: nothing an older PartCAD reads here has changed.
materials:
  #
  # Aluminium
  #
  al-5052-h32:
    formal: 5052-H32
    full: Aluminium alloy 5052-H32
    desc: |
      The sheet-metal aluminium. An Al-Mg alloy that is not heat treatable and
      gets its strength from work hardening, which is what makes it bend
      without cracking on a press brake and hold the bend afterwards: folded
      chassis, brackets, enclosures and battery trays are 5052 far more often
      than anything else. It welds, it resists salt water better than the
      heat-treatable alloys, and it has the best fatigue life of the common
      sheet grades - but it does not machine cleanly and cannot be strengthened
      by heat treatment afterwards.
    url: https://en.wikipedia.org/wiki/5052_aluminium_alloy
    density: 2680 # kg/m^3
    youngsModulus: 7.03e+10 # Pa, 5052-H32; H32 (strain hardened, stabilised), typical. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA5052H32
    poissonsRatio: 0.33 # 5052-H32; H32 (strain hardened, stabilised), typical. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA5052H32
    yieldStrength: 1.93e+8 # Pa, 5052-H32; H32 (strain hardened, stabilised), typical; typical (AA), not a specification minimum. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA5052H32
    thermalConductivity: 138 # W/(m*K), 5052-H32; H32 (strain hardened, stabilised), typical; at 77 F (25 C). https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA5052H32
    mu: 1.05
    tags:
      - metal
      - aluminium
      - sheet-metal
      - formable
      - weldable
      - corrosion-resistant
      - fatigue-resistant
  al-6061-t6:
    formal: 6061-T6
    full: Aluminium alloy 6061-T6
    desc: |
      The general-purpose structural aluminium: plate, bar and extrusion for
      machined robot links, mounting plates, heat sinks and airframe fittings.
      Heat treatable, weldable, and it machines and anodises well, which is why
      it is the default for anything cut from solid. Welding anneals the heat
      affected zone back towards the annealed strength, so a welded frame is
      not a T6 frame unless it is re-treated.
    url: https://en.wikipedia.org/wiki/6061_aluminium_alloy
    density: 2700
    youngsModulus: 6.89e+10 # Pa, 6061-T6; T6, typical. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA6061T6
    poissonsRatio: 0.33 # 6061-T6; T6, typical. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA6061T6
    yieldStrength: 2.76e+8 # Pa, 6061-T6; T6, typical; typical (AA), not a specification minimum. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA6061T6
    thermalConductivity: 167 # W/(m*K), 6061-T6; T6, typical; at 77 F (25 C). https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA6061T6
    mu: 1.05
    tags:
      - metal
      - aluminium
      - machinable
      - weldable
      - heat-treatable
      - structural
  al-6063-t5:
    formal: 6063-T5
    full: Aluminium alloy 6063-T5
    desc: |
      The extrusion alloy. It flows through a die into thin, complex and
      accurate sections and takes a clean anodised finish, at some cost in
      strength against 6061 - so it is what T-slot framing, enclosure profiles,
      rails and heat-sink fins are made of. Robot cells and test rigs are
      largely built out of it without anybody machining anything.
    url: https://en.wikipedia.org/wiki/6063_aluminium_alloy
    density: 2700
    youngsModulus: 6.89e+10 # Pa, 6063-T5; T5, typical (1.6 mm). https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA6063T5
    poissonsRatio: 0.33 # 6063-T5; T5, typical (1.6 mm). https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA6063T5
    yieldStrength: 1.45e+8 # Pa, 6063-T5; T5, typical (1.6 mm); typical (AA), not a specification minimum. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA6063T5
    thermalConductivity: 209 # W/(m*K), 6063-T5; T5, typical (1.6 mm); at 77 F (25 C). https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA6063T5
    mu: 1.05
    tags:
      - metal
      - aluminium
      - extrusion
      - framing
      - anodising
  al-6082-t6:
    formal: 6082-T6
    full: Aluminium alloy 6082-T6
    desc: |
      The European structural alloy, and what a supplier there offers where a
      US drawing asks for 6061: the same Al-Mg-Si family, a little stronger,
      slightly less obliging to machine and anodise. Plate and extrusion for
      frames, brackets and transport structures.
    url: https://en.wikipedia.org/wiki/6082_aluminium_alloy
    density: 2700
    youngsModulus: 7.0e+10 # Pa, 6082-T6; T6/T651. https://www.aalco.co.uk/datasheets/Aluminium-Alloy-6082-T6T651-Plate_148.ashx
    poissonsRatio: 0.33 # 6082-T6; T6. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA6061T6
    yieldStrength: 2.55e+8 # Pa, 6082-T6; T6/T651 plate 6-12.5 mm; SPECIFICATION MINIMUM per BS EN 485-2:2008 (240 MPa min for 12.5-150 mm). https://www.aalco.co.uk/datasheets/Aluminium-Alloy-6082-T6T651-Plate_148.ashx
    thermalConductivity: 180 # W/(m*K), 6082-T6; T6/T651, room temperature. https://www.aalco.co.uk/datasheets/Aluminium-Alloy-6082-T6T651-Plate_148.ashx
    mu: 1.05
    tags:
      - metal
      - aluminium
      - structural
      - weldable
      - heat-treatable
  al-7075-t6:
    formal: 7075-T6
    full: Aluminium alloy 7075-T6
    desc: |
      The strong one: an Al-Zn alloy that reaches the strength of a mild steel
      at a third of the density, and the reason aircraft fittings, wing spars,
      landing-gear components, competition suspension uprights and highly
      loaded robot arms are cut from it. The price is that it is effectively
      not weldable, is more prone to stress-corrosion cracking than the 5000
      and 6000 series, and costs several times as much.
    url: https://en.wikipedia.org/wiki/7075_aluminium_alloy
    density: 2810
    youngsModulus: 7.17e+10 # Pa, 7075-T6; T6, typical. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA7075T6
    poissonsRatio: 0.33 # 7075-T6; T6, typical. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA7075T6
    yieldStrength: 5.03e+8 # Pa, 7075-T6; T6, typical; typical (AA), not a specification minimum. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA7075T6
    thermalConductivity: 130 # W/(m*K), 7075-T6; T6, typical; at 77 F (25 C). https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA7075T6
    mu: 1.05
    tags:
      - metal
      - aluminium
      - aviation
      - high-strength
      - machinable
  al-2024-t3:
    formal: 2024-T3
    full: Aluminium alloy 2024-T3
    desc: |
      The riveted-airframe alloy. An Al-Cu alloy with the fatigue and
      damage-tolerance behaviour a pressurised fuselage skin needs, which is
      what has kept it in aircraft structure for eighty years. Its corrosion
      resistance is poor, so sheet is normally bought Alclad - rolled with a
      thin layer of pure aluminium on each face - and it is riveted rather than
      welded.
    url: https://en.wikipedia.org/wiki/2024_aluminium_alloy
    density: 2780
    youngsModulus: 7.31e+10 # Pa, 2024-T3; T3, typical (1.6 mm sheet). https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA2024T3
    poissonsRatio: 0.33 # 2024-T3; T3, typical (1.6 mm sheet). https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA2024T3
    yieldStrength: 3.45e+8 # Pa, 2024-T3; T3, typical (1.6 mm sheet); typical (AA), not a specification minimum. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA2024T3
    thermalConductivity: 121 # W/(m*K), 2024-T3; T3, typical (1.6 mm sheet); at 77 F (25 C). https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA2024T3
    mu: 1.05
    tags:
      - metal
      - aluminium
      - aviation
      - fatigue-resistant
      - high-strength
  al-5083-h116:
    formal: 5083-H116
    full: Aluminium alloy 5083-H116
    desc: |
      The strongest of the non-heat-treatable alloys, and the one that keeps
      its strength where it is welded. Marine hulls, pressure vessels,
      cryogenic tanks and armour plate; in vehicles and robots it turns up
      wherever a welded aluminium structure has to be as strong as the sheet it
      was made from.
    url: https://en.wikipedia.org/wiki/5083_aluminium_alloy
    density: 2660
    youngsModulus: 7.03e+10 # Pa, 5083-H116; H116, typical. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA5083H116
    poissonsRatio: 0.33 # 5083-H116; H116, typical. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA5083H116
    yieldStrength: 2.28e+8 # Pa, 5083-H116; H116, typical; typical (AA), not a specification minimum. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA5083H116
    thermalConductivity: 117 # W/(m*K), 5083-H116; H116, typical; at 77 F (25 C). https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MA5083H116
    mu: 1.05
    tags:
      - metal
      - aluminium
      - weldable
      - corrosion-resistant
      - marine
      - cryogenic
  al-a356-t6:
    formal: A356-T6
    full: Aluminium casting alloy A356-T6
    desc: |
      The structural casting alloy: an Al-Si-Mg alloy that fills a mould well
      and, unlike the die-casting alloys, can be heat treated to a useful
      strength and ductility afterwards. Cast road wheels, suspension knuckles,
      gearbox and pump housings, and aerospace castings that have to be
      radiographed and certified.
    url: https://en.wikipedia.org/wiki/Aluminium_alloy
    density: 2680
    youngsModulus: 7.24e+10 # Pa, A356.0-T6; T6 (cast). https://xometry.asia/wp-content/uploads/2025/07/1774070994-A356-Datasheet.pdf
    poissonsRatio: 0.33 # A356.0-T6; T6 (cast). secondary: a search-result excerpt summarising a MatWeb-derived A356.0-T6 sheet and makeitfrom.com/material-properties/356.0-T6-Cast-Aluminum
    thermalConductivity: 151 # W/(m*K), A356.0-T6; T6, room temperature. https://xometry.asia/wp-content/uploads/2025/07/1774070994-A356-Datasheet.pdf
    mu: 1.05
    tags:
      - metal
      - aluminium
      - cast
      - automotive
      - heat-treatable
  al-a380:
    formal: A380
    full: Aluminium die-casting alloy A380
    desc: |
      What a high-pressure die-cast aluminium part is made of unless somebody
      says otherwise: engine and gearbox housings, brackets, electronics
      enclosures, motor end bells. It casts thin walls at speed and conducts
      heat away, at the cost of ductility - a die casting is not a forging, and
      it is not usefully weldable or heat treatable because of the gas trapped
      during the shot.
    url: https://en.wikipedia.org/wiki/Aluminium_alloy
    density: 2710
    youngsModulus: 7.1e+10 # Pa, A380.0-F; F (as die cast). https://xometry.asia/wp-content/uploads/2021/12/1773641044-A380-Datasheet.pdf
    yieldStrength: 1.59e+8 # Pa, A380.0-F; F (as die cast); typical. secondary: a search-result excerpt citing Dynacast die-cast metal properties table (A380 0.2% yield 23 ksi) and a NADCA-derived DTIC report (23 ksi); the Dynacast page itself was not read
    thermalConductivity: 96.2 # W/(m*K), A380.0-F; F, room temperature. secondary: search-result excerpts quoting die-casting tables listing 55.6 BTU/(ft hr F) = 96.2 W/(m K) (NADCA value); patent text 'A380 ... 96.2 W/(m*k) in the literature'
    mu: 1.05
    tags:
      - metal
      - aluminium
      - die-cast
      - automotive
      - thermally-conductive

  #
  # Carbon and alloy steel
  #
  steel-1018:
    formal: AISI 1018
    full: Low-carbon steel AISI 1018
    desc: |
      Mild steel: cheap, weldable, forgiving, and the default for shafts,
      spacers, jigs, weldments and anything machined where strength is not the
      constraint. Too soft to hold a bearing surface as it is, so it is case
      hardened when it has to.
    url: https://en.wikipedia.org/wiki/Carbon_steel
    density: 7870
    youngsModulus: 2.0e+11 # Pa, AISI 1018; cold drawn. https://www.mwcomponents.com/uploads/Resource-Center/Elgin-Material-Sheets/Carbon-Steel-Grade-1018-Data-Sheet_Elgin.pdf
    poissonsRatio: 0.29 # AISI 1018; cold drawn. https://www.mwcomponents.com/uploads/Resource-Center/Elgin-Material-Sheets/Carbon-Steel-Grade-1018-Data-Sheet_Elgin.pdf
    yieldStrength: 3.7e+8 # Pa, AISI 1018; cold drawn (this catalogue names no condition: cold-drawn bar, the usual 1018 stock, is assumed). https://www.mwcomponents.com/uploads/Resource-Center/Elgin-Material-Sheets/Carbon-Steel-Grade-1018-Data-Sheet_Elgin.pdf
    thermalConductivity: 51.9 # W/(m*K), AISI 1018; room temperature. https://www.mwcomponents.com/uploads/Resource-Center/Elgin-Material-Sheets/Carbon-Steel-Grade-1018-Data-Sheet_Elgin.pdf
    mu: 0.6
    tags:
      - metal
      - steel
      - weldable
      - machinable
      - low-cost
  steel-1045:
    formal: AISI 1045
    full: Medium-carbon steel AISI 1045
    desc: |
      Medium-carbon steel that can be through hardened, which is what puts it
      in shafts, axles, gears, sprockets and hydraulic rod. Stronger than 1018
      as supplied and noticeably less pleasant to weld.
    url: https://en.wikipedia.org/wiki/Carbon_steel
    density: 7870
    youngsModulus: 2.0e+11 # Pa, AISI 1045; any (insensitive to condition). https://kmac-distribution.com/technical/1045-carbon-steel.htm
    poissonsRatio: 0.29 # AISI 1045; any. https://kmac-distribution.com/technical/1045-carbon-steel.htm
    yieldStrength: 5.17e+8 # Pa, AISI 1045; cold finished (cold drawn) bar, 'as supplied'; typical. https://www.myalro.com/gradeinfo/Metals_Gridpt.aspx?gp=0004
    thermalConductivity: 51.9 # W/(m*K), AISI 1045; room temperature (temperature not stated by source). https://kmac-distribution.com/technical/1045-carbon-steel.htm
    mu: 0.6
    tags:
      - metal
      - steel
      - heat-treatable
      - wear-resistant
  steel-a36:
    formal: ASTM A36
    full: Structural steel ASTM A36
    desc: |
      The structural plate and section steel: frames, base plates, weldments,
      machine bases and anything fabricated out of hot-rolled stock. Specified
      by its minimum yield rather than by its composition, which is why it is a
      grade rather than an alloy.
    url: https://en.wikipedia.org/wiki/A36_steel
    density: 7850
    youngsModulus: 2.0e+11 # Pa, ASTM A36; hot rolled. https://en.wikipedia.org/wiki/A36_steel
    poissonsRatio: 0.26 # ASTM A36; hot rolled. https://en.wikipedia.org/wiki/A36_steel
    yieldStrength: 2.5e+8 # Pa, ASTM A36; SPECIFICATION MINIMUM (ASTM A36, plates/bars/shapes < 8 in thick; 220 MPa above 8 in). https://en.wikipedia.org/wiki/A36_steel
    thermalConductivity: 50.2 # W/(m*K), ASTM A36; room temperature. https://www.onlinemetals.com/en/product-guide/alloy/A36
    mu: 0.6
    tags:
      - metal
      - steel
      - structural
      - weldable
      - low-cost
  steel-4130:
    formal: AISI 4130
    full: Chromium-molybdenum steel AISI 4130
    desc: |
      Chromoly: the tube an aircraft fuselage, a roll cage, a motorcycle frame
      or a race-car chassis is welded from. High strength for its weight, and -
      unusually for a strong alloy steel - it TIG welds thin wall without
      needing heat treatment afterwards for most airframe work.
    url: https://en.wikipedia.org/wiki/41xx_steel
    density: 7850
    youngsModulus: 2.05e+11 # Pa, AISI 4130; normalized 870 C, 25 mm round. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=m4130r
    poissonsRatio: 0.29 # AISI 4130; normalized. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=m4130r
    yieldStrength: 4.35e+8 # Pa, AISI 4130; normalized at 870 C (1600 F), 25 mm round - the usual condition (N) of 4130 aircraft/chassis tube; typical. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=m4130r
    thermalConductivity: 42.7 # W/(m*K), AISI 4130; at 100 C. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=m4130r
    mu: 0.6
    tags:
      - metal
      - steel
      - aviation
      - automotive
      - high-strength
      - weldable
  steel-4140:
    formal: AISI 4140
    full: Chromium-molybdenum steel AISI 4140
    desc: |
      The through-hardening alloy steel of machine building: gear blanks,
      drive and output shafts, suspension and steering components, tooling and
      dies. Bought pre-hardened and tempered as often as it is heat treated
      after machining.
    url: https://en.wikipedia.org/wiki/41xx_steel
    density: 7850
    youngsModulus: 2.05e+11 # Pa, AISI 4140; normalized. https://www.mwcomponents.com/uploads/Resource-Center/Elgin-Material-Sheets/Alloy-Steel-Grade-4140-Fact-Sheet_Elgin-Website.pdf
    poissonsRatio: 0.29 # AISI 4140; normalized. https://www.mwcomponents.com/uploads/Resource-Center/Elgin-Material-Sheets/Alloy-Steel-Grade-4140-Fact-Sheet_Elgin-Website.pdf
    yieldStrength: 6.55e+8 # Pa, AISI 4140; normalized 870 C, 25 mm round, 302 HB (~32 HRC) - comparable to the 28-32 HRC 'pre-hardened' (4140 HT) bar the catalogue describes; typical. https://www.mwcomponents.com/uploads/Resource-Center/Elgin-Material-Sheets/Alloy-Steel-Grade-4140-Fact-Sheet_Elgin-Website.pdf
    thermalConductivity: 42.6 # W/(m*K), AISI 4140; at 100 C. https://www.mwcomponents.com/uploads/Resource-Center/Elgin-Material-Sheets/Alloy-Steel-Grade-4140-Fact-Sheet_Elgin-Website.pdf
    mu: 0.6
    tags:
      - metal
      - steel
      - heat-treatable
      - high-strength
      - automotive
  steel-4340:
    formal: AISI 4340
    full: Nickel-chromium-molybdenum steel AISI 4340
    desc: |
      Where 4140 is not tough enough: landing-gear legs, aircraft and
      helicopter shafts, torsion bars, highly loaded gears. Nickel buys
      hardenability deep into a thick section and toughness at high strength,
      and it is one of the alloys hydrogen embrittlement rules are written for.
    url: https://en.wikipedia.org/wiki/SAE_steel_grades
    density: 7850
    youngsModulus: 2.05e+11 # Pa, AISI 4340; normalized / Q&T (insensitive). https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=M434AE
    poissonsRatio: 0.29 # AISI 4340; oil quenched and tempered. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=m434ap
    thermalConductivity: 44.5 # W/(m*K), AISI 4340; room temperature. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=M434AE
    mu: 0.6
    tags:
      - metal
      - steel
      - aviation
      - high-strength
      - tough
  steel-dp600:
    formal: DP600
    full: Dual-phase advanced high-strength steel DP600
    desc: |
      Body-in-white steel: soft ferrite with hard martensite islands in it, so
      that it stamps like a mild steel and work hardens into something much
      stronger in the panel. Rails, cross members and reinforcements, where the
      structure has to absorb a crash rather than resist it.
    url: https://en.wikipedia.org/wiki/Dual-phase_steel
    density: 7850
    youngsModulus: 2.1e+11 # Pa, DP600 (HCT590X / CR330Y590T-DP); as delivered. https://www.SteelConstruction.info/images/8/86/GN_3-01.pdf
    poissonsRatio: 0.3 # DP600 (HCT590X / CR330Y590T-DP); as delivered. https://www.SteelConstruction.info/images/8/86/GN_3-01.pdf
    yieldStrength: 4.0e+8 # Pa, DP600 (HCT590X / CR330Y590T-DP); cold rolled, as delivered (before forming/bake hardening); typical. https://tatasteeluk.com/sites/default/files/tata-steel-automotive-cr-dp600-uc-cr330y590t-hct590x-dual-phase-datasheet-en.pdf
    mu: 0.6
    tags:
      - metal
      - steel
      - automotive
      - sheet-metal
      - formable
      - crashworthy
  steel-22mnb5:
    formal: 22MnB5
    full: Boron steel 22MnB5, press hardened
    desc: |
      The hot-stamped boron steel of the passenger safety cell: formed at
      around 900 C and quenched in the die, which leaves a fully martensitic
      part several times stronger than the blank that went in. B-pillars, door
      intrusion beams, bumper beams and roof rails. It cannot be cold formed or
      welded in the field to any useful effect, which is why rescue tooling
      cares which cars have it.
    url: https://en.wikipedia.org/wiki/Boron_steel
    density: 7850
