  #
  # Cast iron
  #
  cast-iron-gray:
    formal: Gray iron
    full: Gray cast iron
    desc: |
      Iron with its carbon as graphite flakes, which makes it brittle in
      tension, excellent at damping vibration and easy to machine. Engine
      blocks and heads, brake discs and drums, flywheels, machine-tool beds and
      robot bases: the flakes conduct heat out of a brake disc and swallow the
      chatter a machine frame would otherwise ring with.
    url: https://en.wikipedia.org/wiki/Gray_iron
    density: 7150
    poissonsRatio: 0.26 # EN-GJL-200 (~ASTM A48 Class 30); EN-GJL-200 (same for 250/300). https://www.ke-ag.de/wp-content/uploads/2018/10/Werkstofftabelle-GJLver2018.pdf
    thermalConductivity: 50 # W/(m*K), EN-GJL-200 (~ASTM A48 Class 30); EN-GJL-200 at 100 C (46.0 at 500 C). https://www.ke-ag.de/wp-content/uploads/2018/10/Werkstofftabelle-GJLver2018.pdf
    tags:
      - metal
      - cast-iron
      - cast
      - automotive
      - damping
      - machinable
  cast-iron-ductile:
    formal: Ductile iron
    full: Ductile (nodular) cast iron
    desc: |
      The same iron with the graphite balled up instead of flaked, which gives
      back most of the ductility and lets a casting be loaded in tension:
      crankshafts, steering knuckles, differential and suspension components,
      gearbox housings, pipe. Often the cheaper answer where a steel forging
      would otherwise be specified.
    url: https://en.wikipedia.org/wiki/Ductile_iron
    density: 7100
    youngsModulus: 1.69e+11 # Pa, ASTM A536 65-45-12 (~EN-GJS-450-10/400-15); as cast. secondary: search-result excerpts quoting ASTM A536 grade table from a distributor ('65-45-12 ... 0.28 24.5 Msi (169 GPa)') and totalmateria.com/en-us/material/1055031 (EN-GJS-400-15: 169 GPa)
    poissonsRatio: 0.28 # ASTM A536 65-45-12 (~EN-GJS-450-10/400-15); as cast. secondary: a search-result excerpt quoting ASTM A536 grade table from a distributor (65-45-12: 0.28)
    yieldStrength: 3.1e+8 # Pa, ASTM A536 65-45-12 (~EN-GJS-450-10/400-15); grade 65-45-12; SPECIFICATION MINIMUM (ASTM A536, 45 ksi). secondary: a search-result excerpt quoting ASTM A536 grade table ('65-45-12 ... 65,000 psi (448 MPa) 45,000 psi (310 MPa)')
    thermalConductivity: 36 # W/(m*K), ASTM A536 65-45-12 (~EN-GJS-450-10/400-15); room temperature. secondary: a search-result excerpt quoting makeitfrom.com 65-45-12 vs ductile cast iron comparison (36 W/m-K, range 31-36)
    tags:
      - metal
      - cast-iron
      - cast
      - automotive
      - tough

