  #
  # Cast iron
  #
  # Gray iron by its EN 1561 grade, through the three grades of Kemptener
  # Eisengiesserei's (KE-AG) material table - EN-GJL-200, -250 and -300, which
  # it gives as ASTM A48 class 30, 35/40 and 45 - measured on separately cast
  # 30 mm bars, https://www.ke-ag.de/wp-content/uploads/2018/10/Werkstofftabelle-GJLver2018.pdf ;
  # interpolated between them. Gray iron has no yield point: it is brittle in
  # tension, and none is stated.
  cast-iron-gray:
    parameters:
      grade:
        type: int
        default: 200
        min: 200
        max: 300
        desc: "EN 1561 grade, the EN-GJL number: its tensile strength in N/mm^2. 200 is about ASTM A48 class 30, 250 class 35/40 and 300 class 45 (KE-AG)"
    formal: Gray iron
    full: Gray cast iron
    desc: |
      Iron with its carbon as graphite flakes, which makes it brittle in
      tension, excellent at damping vibration and easy to machine. Engine
      blocks and heads, brake discs and drums, flywheels, machine-tool beds and
      robot bases: the flakes conduct heat out of a brake disc and swallow the
      chatter a machine frame would otherwise ring with. The stronger grades
      are stiffer too, and conduct a little less.
    url: https://en.wikipedia.org/wiki/Gray_iron
    density: "%interpolate(grade, [200, 250, 300], [7150, 7200, 7250])%" # kg/m^3; KE-AG, each grade above; interpolated.
    youngsModulus: "%interpolate(grade, [200, 250, 300], [8.8e+10, 1.03e+11, 1.08e+11])%" # Pa; LOWER BOUND of KE-AG's load-dependent modulus for each grade (88-113, 103-118 and 108-137 GPa) - the secant modulus at a working stress, which falls as the stress rises; interpolated.
    poissonsRatio: 0.26 # EN-GJL-200 (~ASTM A48 Class 30); EN-GJL-200 (same for 250/300). https://www.ke-ag.de/wp-content/uploads/2018/10/Werkstofftabelle-GJLver2018.pdf
    thermalConductivity: "%interpolate(grade, [200, 250, 300], [50, 48.5, 47.5])%" # W/(m*K), at 100 C (46.0, 44.5 and 43.0 at 500 C); KE-AG, each grade above; interpolated.
    tags:
      - metal
      - cast-iron
      - cast
      - automotive
      - damping
      - machinable
  cast-iron-ductile:
    parameters:
      grade:
        type: int
        default: 65
        min: 60
        max: 120
        desc: "ASTM A536 grade, by its first number, the minimum tensile strength in ksi: 60 (60-40-18), 65 (65-45-12), 80 (80-55-06), 100 (100-70-03) or 120 (120-90-02)"
    formal: Ductile iron
    full: Ductile (nodular) cast iron
    desc: |
      The same iron with the graphite balled up instead of flaked, which gives
      back most of the ductility and lets a casting be loaded in tension:
      crankshafts, steering knuckles, differential and suspension components,
      gearbox housings, pipe. Often the cheaper answer where a steel forging
      would otherwise be specified. The low grades (60, 65) are the ductile
      ones, stretching 18 and 12 per cent before they break; the high grades
      (80 to 120) are stronger and stretch 6 to 2.
    url: https://en.wikipedia.org/wiki/Ductile_iron
    density: 7100
    youngsModulus: 1.69e+11 # Pa, ASTM A536 65-45-12 (~EN-GJS-450-10/400-15); as cast; taken for every grade, as the Ductile Iron Society gives 162-170 GPa in tension for ductile iron at large (Ductile Iron Data for Design Engineers, section III, p. 3-3, https://assets.noviams.com/novi-file-uploads/dis/Education/Ductile_Iron_Data-49ae2969.pdf). secondary: search-result excerpts quoting ASTM A536 grade table from a distributor ('65-45-12 ... 0.28 24.5 Msi (169 GPa)') and totalmateria.com/en-us/material/1055031 (EN-GJS-400-15: 169 GPa)
    poissonsRatio: 0.28 # ASTM A536 65-45-12 (~EN-GJS-450-10/400-15); as cast; taken for every grade. secondary: a search-result excerpt quoting ASTM A536 grade table from a distributor (65-45-12: 0.28)
    yieldStrength: "%pick(grade, [60, 65, 80, 100, 120], [2.76e+8, 3.1e+8, 3.79e+8, 4.83e+8, 6.21e+8])%" # Pa; SPECIFICATION MINIMUM of each grade (ASTM A536: 276, 310, 379, 483 and 621 MPa), as the Ductile Iron Society reproduces its table (Ductile Iron Data for Design Engineers, section XII, p. 12-4). https://assets.noviams.com/novi-file-uploads/dis/Education/Ductile_Iron_Data-49ae2969.pdf
    thermalConductivity: 36 # W/(m*K), ASTM A536 65-45-12 (~EN-GJS-450-10/400-15); room temperature; taken for every grade, which overstates it for the pearlitic ones (KE-AG gives 36.2 for the ferritic EN-GJS grades and 31.1 for 700-2, at 330 C: https://www.ke-ag.de/wp-content/uploads/2018/10/Kopie-von-Werkstofftabelle-GJS_ver2018-Tabelle1.pdf). secondary: a search-result excerpt quoting makeitfrom.com 65-45-12 vs ductile cast iron comparison (36 W/m-K, range 31-36)
    tags:
      - metal
      - cast-iron
      - cast
      - automotive
      - tough

  #
  # Zinc
  #
  zamak-3:
    formal: Zamak 3
    full: Zinc die-casting alloy Zamak 3
    desc: |
      The default zinc die-casting alloy: gearbox and connector housings,
      latches, brackets, interior hardware and toys. It casts at a low enough
      temperature to make dies last, holds tight tolerances and fine detail,
      and takes plating well - at four times the density of aluminium, which
      is why it stays out of anything that has to be light.
    url: https://en.wikipedia.org/wiki/Zamak
    density: 6600
    yieldStrength: 2.08e+8 # Pa, Zamak 3 (ZL3 / ZP3, ASTM AG40A); as die cast; 0.2% offset; typical. https://en.wikipedia.org/wiki/Zamak
    thermalConductivity: 113 # W/(m*K), Zamak 3 (ZL3 / ZP3, ASTM AG40A); room temperature. https://en.wikipedia.org/wiki/Zamak
    tags:
      - metal
      - zinc
      - die-cast
      - platable
      - low-cost
