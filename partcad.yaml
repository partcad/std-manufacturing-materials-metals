    poissonsRatio: 0.29 # AISI 4140; normalized; taken for every condition. https://www.mwcomponents.com/uploads/Resource-Center/Elgin-Material-Sheets/Alloy-Steel-Grade-4140-Fact-Sheet_Elgin-Website.pdf
    # Normalized: 655 MPa, AISI 4140 normalized 870 C, 25 mm round, 302 HB (~32 HRC), typical, https://www.mwcomponents.com/uploads/Resource-Center/Elgin-Material-Sheets/Alloy-Steel-Grade-4140-Fact-Sheet_Elgin-Website.pdf .
    # Quenched and tempered: Rp0.2 of 42CrMo4 (1.7225, which Lucefin gives as AISI 4140's equivalent) on 10 mm rounds quenched at 850 C in oil and tempered every 50 C from 100 to 700 C - 1520, 1600, 1620, 1590, 1560, 1510, 1440, 1340, 1230, 1110, 1000, 870 and 710 N/mm^2 - from Lucefin's tempering table, https://www.lucefin.com/wp-content/files_mf/152353604042CrMo4.pdf ; interpolated between them.
