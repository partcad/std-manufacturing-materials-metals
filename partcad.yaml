      The general-purpose stainless: fasteners, sheet, tube, frames, food and
      laboratory equipment, and anything that has to stay clean or stay
      outdoors. Non-magnetic as annealed, though cold work raises a little
      ferromagnetism in it.
    url: https://en.wikipedia.org/wiki/SAE_304_stainless_steel
    density: 8000
    youngsModulus: 1.93e+11 # Pa, AISI 304; annealed. https://d1io3yog0oux5.cloudfront.net/_7ce3a04c09e74bf31ff5f89fc888db25/clevelandcliffs/db/1190/10510/file/CLF_ProductData_304-304LSS_052021.pdf
    poissonsRatio: 0.29 # AISI 304; annealed. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=MQ304A
    yieldStrength: 2.9e+8 # Pa, AISI 304; annealed sheet/strip; typical. https://d1io3yog0oux5.cloudfront.net/_7ce3a04c09e74bf31ff5f89fc888db25/clevelandcliffs/db/1190/10510/file/CLF_ProductData_304-304LSS_052021.pdf
    thermalConductivity: 16.2 # W/(m*K), AISI 304; at 100 C (212 F). https://d1io3yog0oux5.cloudfront.net/_7ce3a04c09e74bf31ff5f89fc888db25/clevelandcliffs/db/1190/10510/file/CLF_ProductData_304-304LSS_052021.pdf
    mu: 0.7
    color: ":stainless-steel"
    tags:
      - metal
      - stainless
      - corrosion-resistant
      - weldable
      - hygienic
  ss-316l:
    formal: AISI 316L
    full: Austenitic stainless steel AISI 316L
    desc: |
      304 with molybdenum, which is what it takes to hold up against chlorides:
      salt water, de-icing salt, chemical plant and the inside of a body. The
      L is the low-carbon variant that can be welded without sensitising the
      heat affected zone, and it is the most common stainless powder for
      printed metal parts.
    url: https://en.wikipedia.org/wiki/SAE_316L_stainless_steel
    density: 8000
    youngsModulus: 1.93e+11 # Pa, AISI 316L; annealed. https://d1io3yog0oux5.cloudfront.net/_464c1f648dd1e0c96c45d68cdce1cf31/clevelandcliffs/db/1190/10513/file/CLF_ProductData_316-316LSS_052021.pdf
    thermalConductivity: 16.2 # W/(m*K), AISI 316L; at 100 C (212 F). https://d1io3yog0oux5.cloudfront.net/_464c1f648dd1e0c96c45d68cdce1cf31/clevelandcliffs/db/1190/10513/file/CLF_ProductData_316-316LSS_052021.pdf
    mu: 0.7
    color: ":stainless-steel"
    tags:
      - metal
      - stainless
      - corrosion-resistant
      - marine
      - weldable
      - medical
  ss-17-4ph:
    parameters:
      condition:
        type: string
        enum: [A, H900, H925, H1025, H1075, H1150, H1150-M]
        default: H900
        desc: "The heat treatment, as Cleveland-Cliffs names it: A solution treated at 1038 C (as supplied); H900 to H1150 then aged 1-4 h at that temperature in F (482-621 C), stronger the lower it is; H1150-M double aged, 760 C then 621 C"
    formal: 17-4 PH
    full: Precipitation-hardening stainless steel 17-4 PH
    desc: |
      Stainless with the strength of an alloy steel, reached by a single low
      temperature ageing treatment that distorts almost nothing - so a part can
      be machined to size as supplied (condition A) and hardened afterwards:
      H900 the strongest, H1025 to H1150 more ductile and far more resistant to
      stress-corrosion cracking. Aerospace fittings, valve and pump shafts,
      injection mould inserts, and a common printed metal alloy.
    url: https://en.wikipedia.org/wiki/Precipitation_hardening
    density: 7800
    youngsModulus: 1.97e+11 # Pa, 17-4 PH (UNS S17400); H900; taken for every condition, as ATI gives one modulus for all of them (https://www.atimaterials.com/Products/Documents/datasheets/stainless-specialty-steel/precipitationhardening/ati_17-4_tds_en_v2.pdf). https://d1io3yog0oux5.cloudfront.net/_7ce3a04c09e74bf31ff5f89fc888db25/clevelandcliffs/db/1190/10503/file/CLF_ProductData_17-4-PHSS_052021.pdf
    poissonsRatio: 0.272 # 17-4 PH (UNS S17400); all conditions. https://d1io3yog0oux5.cloudfront.net/_7ce3a04c09e74bf31ff5f89fc888db25/clevelandcliffs/db/1190/10503/file/CLF_ProductData_17-4-PHSS_052021.pdf
    yieldStrength: "%pick(condition, ['A', 'H900', 'H925', 'H1025', 'H1075', 'H1150', 'H1150-M'], [7.93e+8, 1.275e+9, 1.207e+9, 1.138e+9, 1.103e+9, 8.96e+8, 7.65e+8])%" # Pa, 17-4 PH (UNS S17400); 0.2 % yield, typical, transverse; the condition's column of Cleveland-Cliffs' Table 2. https://d1io3yog0oux5.cloudfront.net/_7ce3a04c09e74bf31ff5f89fc888db25/clevelandcliffs/db/1190/10503/file/CLF_ProductData_17-4-PHSS_052021.pdf
    thermalConductivity: 17.8 # W/(m*K), 17-4 PH (UNS S17400); H900, mean 21-100 C; taken for every condition. https://www.atimaterials.com/Products/Documents/datasheets/stainless-specialty-steel/precipitationhardening/ati_17-4_tds_en_v2.pdf
    mu: 0.6
    color: ":stainless-steel"
    tags:
      - metal
      - stainless
      - aviation
      - high-strength
      - heat-treatable

  #
  # Titanium
  #
  ti-6al-4v:
    formal: Ti-6Al-4V
    full: Titanium alloy Ti-6Al-4V (Grade 5)
    desc: |
      Half the world's titanium, and the reason the metal has a reputation:
      the strength of an alloy steel at 60% of the density, immune to most
      corrosion, and holding both up to about 400 C. Airframe and engine
      structure, fasteners, rocket hardware, medical implants, and the printed
      bracket that replaced a machined assembly. It is expensive, it galls
      against itself, and it is unforgiving to machine - slow, sharp, flooded,
      and never rubbing.
    url: https://en.wikipedia.org/wiki/Ti-6Al-4V
    density: 4430
    youngsModulus: 1.138e+11 # Pa, Ti-6Al-4V (Grade 5); annealed. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=mtp641
    poissonsRatio: 0.342 # Ti-6Al-4V (Grade 5); annealed. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=mtp641
    yieldStrength: 8.8e+8 # Pa, Ti-6Al-4V (Grade 5); annealed; typical (Allvac data). https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=mtp641
    thermalConductivity: 6.7 # W/(m*K), Ti-6Al-4V (Grade 5); annealed, room temperature. https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=mtp641
    color: ":titanium"
    tags:
      - metal
      - titanium
      - aviation
      - high-strength
      - lightweight
      - corrosion-resistant
      - biocompatible
  # Unalloyed titanium by its ASTM grade. Every value is from the data sheet
  # Aerospace Specification Metals publishes for the grade, annealed - the
  # data its pages on asm.matweb.com show, which this catalogue cited for
  # Grade 2 before it had grades:
  #   1  https://www.aerospacemetals.com/wp-content/uploads/2023/07/Titanium-Grade-1-Annealed-Data-Sheet.pdf
  #   2  https://asm.matweb.com/search/SpecificMaterial.asp?bassnum=mtu021 (annealed 2 h at 700 C), as https://www.aerospacemetals.com/wp-content/uploads/2023/07/Titanium-Grade-2-Annealed-Data-Sheet.pdf
  #   3  https://www.aerospacemetals.com/wp-content/uploads/2023/07/Titanium-Grade-3-Annealed-Data-Sheet.pdf
  #   4  https://www.aerospacemetals.com/wp-content/uploads/2023/07/Titanium-Grade-4-Annealed-Data-Sheet.pdf
  ti-cp:
    parameters:
      grade:
        type: int
        default: 2
        min: 1
        max: 4
        desc: "ASTM grade of unalloyed titanium, 1 to 4: the higher the grade, the more oxygen and iron in it, and the stronger and less formable it is"
    formal: "Ti Grade %grade%"
    full: "Commercially pure titanium, Grade %grade%"
    desc: |
      Unalloyed titanium: much weaker than Grade 5 and much easier to form and
      weld, with the same corrosion immunity. Sheet, tube, heat exchangers,
      chemical and marine hardware, and surgical instruments. Grade 1 is the
      softest and most formable, Grade 4 the strongest.
    url: https://en.wikipedia.org/wiki/Titanium
    density: "%pick(grade, [1, 2, 3, 4], [4510, 4510, 4500, 4510])%" # kg/m^3; each grade's sheet above.
    youngsModulus: "%pick(grade, [1, 2, 3, 4], [1.0e+11, 1.02e+11, 1.04e+11, 1.05e+11])%" # Pa; in tension; annealed (Grade 4's sheet: heat treatment unspecified); each grade's sheet above.
    poissonsRatio: 0.34 # every grade; annealed; each grade's sheet above.
    yieldStrength: "%pick(grade, [1, 2, 3, 4], [2.4e+8, 3.4e+8, 4.5e+8, 5.9e+8])%" # Pa; annealed; typical; each grade's sheet above.
    thermalConductivity: "%pick(grade, [1, 2, 3, 4], [16, 16.4, 16.4, 16.9])%" # W/(m*K); annealed, room temperature; each grade's sheet above.
    color: ":titanium"
    tags:
      - metal
      - titanium
      - formable
      - weldable
      - corrosion-resistant
      - biocompatible
  ti-grade-2:
    type: enrich
    source: ":ti-cp"
    with: {grade: 2}

  #
  # Magnesium
  #
  mg-az31b:
    formal: AZ31B
    full: Magnesium alloy AZ31B
    desc: |
      The lightest structural metal in common use - a third lighter than
      aluminium - as wrought sheet, plate and extrusion. Instrument and camera
      housings, drone and exoskeleton frames, aircraft interior parts. It
      damps vibration well, corrodes readily unless coated, and burns as swarf.
    url: https://en.wikipedia.org/wiki/Magnesium_alloy
    density: 1770
    youngsModulus: 4.5e+10 # Pa, AZ31B; O / H24 (insensitive to temper). secondary: search-result excerpts quoting matmatch.com/materials/mitf518-az31b-o (45 GPa at 23 C) and techsteel.net/alloy/az31b-0 (44.8 GPa)
    poissonsRatio: 0.35 # AZ31B; H24. https://www.techsteel.net/alloy/az31b-h24
    yieldStrength: 2.0e+8 # Pa, AZ31B; H24 sheet 0.4-6.3 mm (0.016-0.249 in). https://www.smithshp.com/assets/pdf/magnesium/az31b-magnesium-english.pdf
    thermalConductivity: 96 # W/(m*K), AZ31B; H24, room temperature. https://www.techsteel.net/alloy/az31b-h24
    tags:
      - metal
      - magnesium
      - lightweight
      - damping
      - aviation
  mg-az91d:
    formal: AZ91D
    full: Magnesium die-casting alloy AZ91D
    desc: |
      The magnesium die-casting alloy: steering-wheel armatures, seat frames,
      transmission and cam covers, laptop and camera bodies. High purity, so
      it corrodes far less than the older magnesium alloys it replaced, and it
      casts thinner walls than aluminium can.
    url: https://en.wikipedia.org/wiki/Magnesium_alloy
    density: 1810
    youngsModulus: 4.48e+10 # Pa, AZ91D; F (as die cast). https://www.tekogehause.de/uploads/manuali/materiali/AZ91D.pdf
    poissonsRatio: 0.35 # AZ91D; F. https://www.tekogehause.de/uploads/manuali/materiali/AZ91D.pdf
    yieldStrength: 1.5e+8 # Pa, AZ91D; F (as die cast); typical. https://www.tekogehause.de/uploads/manuali/materiali/AZ91D.pdf
    thermalConductivity: 72.7 # W/(m*K), AZ91D; F, room temperature. https://www.tekogehause.de/uploads/manuali/materiali/AZ91D.pdf
    tags:
      - metal
      - magnesium
      - die-cast
      - automotive
      - lightweight

  #
  # Copper and copper alloys
  #
  # The wrought coppers and brasses are the Copper Development Association's
  # standard alloys, and every value of theirs below is from the CDA's page for
  # the alloy, https://alloys.copper.org/alloy/<alloy> (C11000, C21000,
  # C22000, C23000, C24000, C26000, C27000, C28000, C50500, C51000, C52100,
  # C52400), converted to SI: density from the specific gravity, modulus from
  # ksi (x 6.894757e6), conductivity from Btu/(ft*h*F) at 68 F (x 1.730735). A
  # yield strength there is at 0.5 % extension under load, CDA's measure, and
  # not a 0.2 % offset.
  cu-c110:
    parameters:
      temper:
        type: string
        enum: [OS050, OS025, H00, H01, H04, H08, H10]
        default: OS025
        desc: "The temper (ASTM B601): OS050 and OS025 annealed, to a 0.050 or 0.025 mm grain; H00, H01, H04, H08 and H10 cold rolled eighth hard, quarter hard, hard, spring and extra spring"
    formal: C110
    full: Electrolytic tough pitch copper C110
    desc: |
      Copper as an engineering material rather than as an alloy: busbars,
      terminals, motor windings, heat spreaders, cold plates and induction
      coils. Nothing affordable conducts electricity or heat better. Soft,
      heavy, and it work hardens as it is bent - annealed is the soft end of
      its tempers, H10 the hard one.
    url: https://en.wikipedia.org/wiki/Copper
    density: 8890
    youngsModulus: 1.17e+11 # Pa, C11000 (Cu-ETP); any temper. https://alloys.copper.org/alloy/C11000?alloy=C11000
    yieldStrength: "%pick(temper, ['OS050', 'OS025', 'H00', 'H01', 'H04', 'H08', 'H10'], [6.89e+7, 7.58e+7, 1.93e+8, 2.07e+8, 3.1e+8, 3.45e+8, 3.65e+8])%" # Pa, C11000 (Cu-ETP); flat products, typical, at 0.5 % extension under load; the temper's row of CDA's table, which states no yield for half hard (H02). https://alloys.copper.org/alloy/C11000
    thermalConductivity: 391 # W/(m*K), C11000 (Cu-ETP); 68 F (20 C), annealed; taken for every temper. https://alloys.copper.org/alloy/C11000?alloy=C11000
    color: ":copper"
    tags:
      - metal
      - copper
      - conductive
      - thermally-conductive
  # Brass by its zinc content, through the CDA's binary copper-zinc alloys at
  # their nominal zinc: 0.05 C21000 (gilding metal), 0.10 C22000 (commercial
  # bronze), 0.15 C23000 (red brass), 0.20 C24000 (low brass), 0.30 C26000
  # (cartridge brass), 0.35 C27000 (yellow brass), 0.40 C28000 (Muntz metal);
  # interpolated between them. Lead is not a parameter: what it buys is how the
  # brass machines, which no field here states, and otherwise free-machining
  # C36000 is within a per cent of unleaded C27000 in density and conductivity
  # (7 in modulus) - so brass-c360 below keeps the values of its own.
  brass:
    parameters:
      zinc:
        type: float
        default: 0.3
        min: 0.05
        max: 0.4
        desc: "Zinc, mass fraction, 0.05 to 0.4: 0.3 is cartridge brass (C26000), the default; the rest copper"
    formal: "CuZn%round(zinc * 100)%"
    full: "Brass CuZn%round(zinc * 100)% (copper-zinc alloy)"
    desc: |
      Copper and zinc and nothing else of note, from the gilding metal of
      medals, emblems and bullet jackets at 5 per cent zinc through cartridge
      brass at 30 - ammunition cases, radiator tanks, lamp fixtures, eyelets -
      to Muntz metal at 40, which is forged hot rather than formed cold. The
      more zinc, the yellower, cheaper and stronger it is, and the worse it
      conducts heat.
    url: https://en.wikipedia.org/wiki/Brass
    density: "%interpolate(zinc, [0.05, 0.1, 0.15, 0.2, 0.3, 0.35, 0.4], [8860, 8800, 8750, 8670, 8530, 8470, 8390])%" # kg/m^3; CDA, each alloy above; interpolated.
    youngsModulus: "%interpolate(zinc, [0.05, 0.1, 0.15, 0.2, 0.3, 0.35, 0.4], [1.17e+11, 1.17e+11, 1.17e+11, 1.1e+11, 1.1e+11, 1.03e+11, 1.03e+11])%" # Pa, in tension; CDA, each alloy above (17000, 16000 and 15000 ksi); interpolated.
    yieldStrength: "%interpolate(zinc, [0.1, 0.15, 0.2, 0.3, 0.35, 0.4], [9.65e+7, 1.1e+8, 1.17e+8, 1.31e+8, 1.31e+8, 1.45e+8])%" # Pa, annealed, typical, at 0.5 % extension under load; CDA, flat products annealed to a 0.025 mm grain (OS025: 14, 16, 17, 19 and 19 ksi) and C28000 annealed (O61, 21 ksi); interpolated. C21000 has no OS025 row, so below 0.10 zinc it is C22000's.
    thermalConductivity: "%interpolate(zinc, [0.05, 0.1, 0.15, 0.2, 0.3, 0.35, 0.4], [234, 189, 159, 140, 121, 116, 123])%" # W/(m*K), 68 F (20 C); CDA, each alloy above (135, 109, 92, 81, 70, 67 and 71 Btu/(ft*h*F)); interpolated.
    color: ":brass;zinc=%zinc%"
    tags:
      - metal
      - copper
      - brass
      - formable
      - corrosion-resistant
  brass-c280:
    type: enrich
    source: ":brass"
    with: {zinc: 0.4}
    formal: C280
    full: Muntz metal C280 (CuZn40)
    desc: |
      Muntz metal, 60/40 brass: the cheapest and strongest of the plain
      brasses, forged hot rather than formed cold. Condenser plates and tube,
      valve stems, large nuts and bolts, architectural trim and hardware;
      CuZn40 (CW509L) is its European counterpart and GB/T 5231 H59 its
      Chinese one.
    url: https://en.wikipedia.org/wiki/Muntz_metal
    poissonsRatio: 0.34 # CuZn40 (CW509L); room temperature reference value (CDA states none). https://www.wieland.com/de/content/download/9959/file/Z20_RP_EN.pdf
  brass-c360:
    formal: C360
    full: Free-machining brass C360
    desc: |
      The brass a lathe likes: hydraulic and pneumatic fittings, valve bodies,
      electrical connectors, bushings and instrument parts, cut at speeds no
      steel allows. Corrosion resistant, non-sparking, and lead-free
      substitutes are displacing it where drinking water or RoHS is involved.
    url: https://en.wikipedia.org/wiki/Brass
    density: 8500
    youngsModulus: 1.02e+11 # Pa, C36000 (CuZn36Pb3, CW603N); room temperature reference value. https://www.wieland.com/de/content/download/9839/file/Z23_EX_EN.pdf
    yieldStrength: 2.0e+8 # Pa, C36000 (CuZn36Pb3, CW603N); rod R400 (EN 12164), 2-25 mm; SPECIFICATION MINIMUM Rp0.2. https://www.wieland.com/de/content/download/9839/file/Z23_EX_EN.pdf
    thermalConductivity: 100 # W/(m*K), C36000 (CuZn36Pb3, CW603N); room temperature reference value. https://www.wieland.com/de/content/download/9839/file/Z23_EX_EN.pdf
    color: ":brass;zinc=0.355" # C36000's nominal zinc: 60-63 copper, 2.5-3.0 lead, the rest zinc (CDA).
    tags:
      - metal
      - copper
      - machinable
      - corrosion-resistant
      - non-sparking
  bronze-c932:
    formal: C932
    full: Bearing bronze C932 (SAE 660)
    desc: |
      Bearing bronze: the sleeve bearings, thrust washers and worm wheels that
      run against a steel shaft without a rolling element in between. It
      tolerates shock, dirt and marginal lubrication, and it is what a
      sintered, oil-impregnated bushing is made of.
    url: https://en.wikipedia.org/wiki/Bronze
    density: 8930
    youngsModulus: 1.0e+11 # Pa, C93200 (SAE 660); continuous cast. https://concast.com/c93200.php
    yieldStrength: 1.38e+8 # Pa, C93200 (SAE 660); continuous cast; SPECIFICATION MINIMUM (ASTM B505), measured at 0.5% extension under load, not 0.2% offset. https://concast.com/c93200.php
    thermalConductivity: 58.2 # W/(m*K), C93200 (SAE 660); 20 C. https://concast.com/c93200.php
    color: ":bronze"
    tags:
      - metal
      - copper
      - bearing
      - wear-resistant
      - machinable
  # Phosphor bronze by its tin content, through the CDA's wrought copper-tin
  # alloys at their nominal tin: 0.0125 C50500, 0.05 C51000, 0.08 C52100, 0.10
  # C52400; interpolated between them. Conductivity falls steeply with the
  # first few per cent of tin, so between C50500 and C51000 the line is a
  # rough guide.
  bronze-phosphor:
    parameters:
      tin:
        type: float
        default: 0.05
        min: 0.0125
        max: 0.1
        desc: "Tin, mass fraction, 0.0125 to 0.1: 0.05 is C51000, the common one and the default; the rest copper, with a few hundredths of a per cent of phosphorus"
    formal: "CuSn%round(tin * 100)%"
    full: "Phosphor bronze CuSn%round(tin * 100)%"
    desc: |
      Copper with tin and a trace of phosphorus: springs, electrical
      connectors and contact blades, diaphragms and Bourdon tubes, sleeve
      bushings, fasteners and bridge bearing plates. Stronger and springier
      than brass, with a high endurance limit, and a much poorer conductor
      than copper; the more tin, the stronger.
    url: https://en.wikipedia.org/wiki/Phosphor_bronze
    density: "%interpolate(tin, [0.0125, 0.05, 0.08, 0.1], [8890, 8860, 8800, 8780])%" # kg/m^3; CDA, each alloy above; interpolated.
    youngsModulus: "%interpolate(tin, [0.0125, 0.05, 0.08, 0.1], [1.17e+11, 1.1e+11, 1.1e+11, 1.1e+11])%" # Pa, in tension; CDA, each alloy above (17000 and 16000 ksi); interpolated.
    yieldStrength: "%interpolate(tin, [0.0125, 0.05, 0.08, 0.1], [9.65e+7, 1.45e+8, 1.65e+8, 1.93e+8])%" # Pa, annealed, typical, at 0.5 % extension under load; CDA, flat products annealed to a 0.025 mm grain (OS025: 14, 21 and 24 ksi; C52400 has only 0.035 mm, OS035, 28 ksi); interpolated.
    thermalConductivity: "%interpolate(tin, [0.0125, 0.05, 0.08, 0.1], [208, 69.2, 62.3, 50.2])%" # W/(m*K), 68 F (20 C); CDA, each alloy above (120, 40, 36 and 29 Btu/(ft*h*F)); interpolated.
    color: ":bronze"
    tags:
      - metal
      - copper
      - bronze
      - spring
      - wear-resistant
      - corrosion-resistant

  #
  # Nickel superalloys
  #
  inconel-718:
    formal: Inconel 718
    full: Nickel-chromium superalloy Inconel 718
    desc: |
      The workhorse superalloy of a gas turbine: discs, casings, shafts,
      fasteners and rocket-engine parts that have to keep their strength to
      about 700 C. It is age hardened, weldable by superalloy standards, and
      notoriously hard on cutting tools, which is one reason so much of it is
      now printed.
    url: https://en.wikipedia.org/wiki/Inconel
    density: 8190
    youngsModulus: 1.999e+11 # Pa, Inconel 718; solution annealed + aged, 70 F. https://www.specialmetals.com/documents/technical-bulletins/inconel/inconel-alloy-718.pdf
    poissonsRatio: 0.294 # Inconel 718; annealed + aged, 70 F. https://www.specialmetals.com/documents/technical-bulletins/inconel/inconel-alloy-718.pdf
    yieldStrength: 1.034e+9 # Pa, Inconel 718; solution annealed + precipitation hardened (1700-1850 F anneal + standard age); SPECIFICATION MINIMUM (AMS 5662/5596). https://www.specialmetals.com/documents/technical-bulletins/inconel/inconel-alloy-718.pdf
    thermalConductivity: 11.4 # W/(m*K), Inconel 718; annealed + aged, 70 F. https://www.specialmetals.com/documents/technical-bulletins/inconel/inconel-alloy-718.pdf
    tags:
      - metal
      - nickel
      - aviation
      - high-temperature
      - high-strength
  inconel-625:
    formal: Inconel 625
    full: Nickel-chromium superalloy Inconel 625
    desc: |
      Solid-solution strengthened rather than aged, so it is formed and welded
      more easily than 718 and gives up some strength for it. Exhaust systems,
      bellows, expansion joints, seawater and chemical hardware, and weld
      overlay on things made of something cheaper.
    url: https://en.wikipedia.org/wiki/Inconel
    density: 8440
